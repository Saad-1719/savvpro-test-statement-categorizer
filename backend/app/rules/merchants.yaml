# Layer 2: merchant dictionary. Matched against the cleaned merchant key.
# Inside the layer: exact > prefix > regex > contains, then the longer pattern, then file order.
# Only the winning rule produces evidence.

# --- Platforms: income (credits) ---
- id: merchant.platform_tips
  match: regex
  pattern: "^(UBER|DOORDASH|LYFT|GRUBHUB|INSTACART)\\b.*\\b(TIP|TIPS|BONUS|INCENTIVE|QUEST|PROMO)\\b"
  reason: "Platform tip or bonus payout"
  category: Tips & Bonuses
  sign: credit
  priority: 10  # "UBER TIPS PAYOUT" is a tip, not a plain payout
- id: merchant.platform_payout
  match: regex
  pattern: "^(UBER|DOORDASH|LYFT|GRUBHUB|INSTACART)\\b.*\\b(PAYOUT|PAYMENT|EARNINGS|DEPOSIT|DASHER|DRIVER|INSTANT PAY)\\b"
  reason: "Platform payout"
  category: Platform Income
  sign: credit

# --- Platforms: debits ---
- id: merchant.uber_trip
  match: prefix
  pattern: "UBER *TRIP"
  category: Personal
  sign: debit
- id: merchant.uber_eats
  match: prefix
  pattern: "UBER *EATS"
  category: Personal
  sign: debit
- id: merchant.platform_fee
  match: regex
  pattern: "^(UBER|DOORDASH|LYFT|GRUBHUB|INSTACART)\\b.*\\bFEES?\\b"
  reason: "Fee charged by the platform"
  category: Platform Fees
  sign: debit
- id: merchant.doordash_order
  match: prefix
  pattern: "DOORDASH *"
  category: Personal
  sign: debit
- id: merchant.uber_ambiguous
  match: regex
  pattern: "^UBER\\b"
  action: review
  reason: "Uber charge with no ride or eats marker"
  sign: debit
- id: merchant.doordash_ambiguous
  match: regex
  pattern: "^DOORDASH\\b"
  action: review
  reason: "DoorDash charge that is neither a fee nor a food order"
  sign: debit

